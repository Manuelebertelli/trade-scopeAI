<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeScope AI v1.3.6</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ...stili invariati... */
input.freqInput{width:60px;background:#0a0a0a;color:#f5f5f5;border:1px solid #333;border-radius:6px;padding:2px 4px;font-size:12px;text-align:right}
</style>
</head>
<body>
<main>
<div class="card">
<h1>TradeScope AI v1.3.6</h1>
<!-- ...resto dell’interfaccia... -->
</div>
<!-- ...altri componenti... -->
<div class="card">
<h3>Rendimenti dividendi per asset</h3>
<div id="yieldTable" class="status"></div>
</div>
</main>

<script>
// ...tutto il resto dell’app rimane invariato...

// tabella rendimenti con frequenza editabile e conferma
function updateYieldTable(){
  const el = document.getElementById('yieldTable');
  if(!el){ return; }
  let rows = [];
  for(const name in yieldDataByAsset){
    const d = yieldDataByAsset[name];
    rows.push({ name: name, freq: d.freq, data: d });
  }
  if(rows.length === 0){
    el.innerHTML = 'Nessun asset con dividendi e investimento positivo.';
    return;
  }
  // ordina per rendimento netto
  rows.sort((a,b) => {
    const aNet = (a.data.netDiv * a.data.freq) / (a.data.divCount * a.data.costSum) * 100;
    const bNet = (b.data.netDiv * b.data.freq) / (b.data.divCount * b.data.costSum) * 100;
    return bNet - aNet;
  });
  let html = '<table><thead><tr><th>Asset</th><th style="text-align:right">Frequenza</th><th style="text-align:right">Lordo ann.</th><th style="text-align:right">Lordo mese</th><th style="text-align:right">Netto ann.</th><th style="text-align:right">Netto mese</th></tr></thead><tbody>';
  rows.forEach(r => {
    const d = r.data;
    const annualGross = (d.grossDiv * d.freq) / (d.divCount * d.costSum) * 100;
    const annualNet   = (d.netDiv   * d.freq) / (d.divCount * d.costSum) * 100;
    const monthlyGross = annualGross / 12;
    const monthlyNet   = annualNet   / 12;
    html += '<tr>';
    html += '<td>'+r.name+'</td>';
    html += '<td><input class="freqInput" type="number" min="0.1" step="0.1" value="'+d.freq.toFixed(1)+'" data-name="'+r.name+'" data-old="'+d.freq.toFixed(1)+'"></td>';
    html += '<td>'+annualGross.toFixed(2)+'%</td>';
    html += '<td>'+monthlyGross.toFixed(2)+'%</td>';
    html += '<td>'+annualNet.toFixed(2)+'%</td>';
    html += '<td>'+monthlyNet.toFixed(2)+'%</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
  // gestisce l’evento change con conferma
  document.querySelectorAll('.freqInput').forEach(input => {
    input.addEventListener('change', e => {
      const name = e.target.getAttribute('data-name');
      let oldVal = parseFloat(e.target.getAttribute('data-old'));
      let newVal = parseFloat(e.target.value);
      if (!newVal || newVal <= 0) newVal = 1;
      if (newVal !== oldVal) {
        const ok = confirm(`Confermi la modifica della frequenza di ${name} da ${oldVal} a ${newVal}?`);
        if(ok){
          yieldDataByAsset[name].freq = newVal;
          e.target.setAttribute('data-old', newVal.toFixed(1));
          updateYieldTable();
        } else {
          e.target.value = oldVal.toFixed(1);
        }
      }
    });
  });
}

// ...richiamo updateYieldTable() dopo aver popolato yieldDataByAsset come prima...
</script>
</body>
</html>
