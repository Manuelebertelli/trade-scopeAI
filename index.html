<script>

const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]

let state = {
rows: [],
summary: null,
prompt: ''
}

const MORTGAGE = 650

const money = n =>
new Intl.NumberFormat('it-IT',{
style:'currency',
currency:'EUR'
}).format(Number(n)||0)

function mortgageText(v){
return `${(v||0).toFixed(1)}%`
}

function num(v){

if(v === null || v === undefined) return 0

let s = String(v)
.trim()
.replace(/€/g,'')
.replace(/\s/g,'')

if(s.includes(',') && s.includes('.')){
s = s.replace(/\./g,'').replace(',','.')
}
else if(s.includes(',')){
s = s.replace(',','.')
}

return parseFloat(s) || 0

}

/* =========================
   CSV PARSER ROBUSTO
========================= */

function detectDelimiter(text){

const firstLine =
(text || '')
.split(/\r?\n/)
.find(x => x.trim()) || ''

const delimiters = [',',';','\t']

let best = ','
let max = 0

delimiters.forEach(d => {

const count = firstLine.split(d).length

if(count > max){
max = count
best = d
}

})

return best

}

function parseCSV(text){

text = (text || '').replace(/^\uFEFF/,'')

const delimiter = detectDelimiter(text)

const rows = []

let row = []
let current = ''
let insideQuotes = false

for(let i=0;i<text.length;i++){

const char = text[i]
const next = text[i+1]

if(char === '"'){

if(insideQuotes && next === '"'){
current += '"'
i++
}
else{
insideQuotes = !insideQuotes
}

}
else if(char === delimiter && !insideQuotes){

row.push(current)
current = ''

}
else if((char === '\n' || char === '\r') && !insideQuotes){

if(char === '\r' && next === '\n') i++

row.push(current)

if(row.some(v => String(v).trim() !== '')){
rows.push(row)
}

row = []
current = ''

}
else{
current += char
}

}

row.push(current)

if(row.some(v => String(v).trim() !== '')){
rows.push(row)
}

if(!rows.length) return []

const headers = rows[0].map(h => String(h).trim())

return rows.slice(1).map(r => {

let obj = {}

headers.forEach((h,i)=>{
obj[h] = r[i] ?? ''
})

return obj

})

}

/* =========================
   ANALISI
========================= */

function analyze(rows){

let gross = 0
let tax = 0
let net = 0

let monthly = {}
let assets = {}

rows.forEach(r => {

const type =
String(r.type || r.Type || '')
.toUpperCase()

if(type === 'DIVIDEND'){

const g = Math.abs(num(r.amount || r.Amount))
const t = Math.abs(num(r.tax || r.Tax))
const n = Math.max(0, g - t)

gross += g
tax += t
net += n

const month =
String(r.date || r.Date || '')
.slice(0,7)

const asset =
r.name ||
r.Name ||
r.symbol ||
r.Symbol ||
'N/D'

monthly[month] ??= 0
monthly[month] += n

assets[asset] ??= 0
assets[asset] += n

}

})

const avg =
Object.keys(monthly).length
? net / Object.keys(monthly).length
: 0

const mortgage = avg / MORTGAGE * 100

state.summary = {
gross,
tax,
net,
avg,
mortgage,
monthly,
assets
}

render(rows)

}

/* =========================
   RENDER
========================= */

function render(rows){

const s = state.summary

$('#kRows').textContent = rows.length
$('#kGross').textContent = money(s.gross)
$('#kTax').textContent = money(s.tax)
$('#kNet').textContent = money(s.net)
$('#kAvg').textContent = money(s.avg)
$('#kMortgage').textContent = mortgageText(s.mortgage)

$('#riskBox').innerHTML = `
<div class="status">
<b>Dividendi netti</b><br>
${money(s.net)}
</div>

<div class="status">
<b>Copertura mutuo</b><br>
${mortgageText(s.mortgage)}
</div>
`

$('#divBox').innerHTML = `
<div class="status">
<b>Forecast netto annuo</b><br>
${money(s.avg * 12)}
</div>
`

/* ===== TABELLA ===== */

$('#thead').innerHTML = `
<tr>
<th>Data</th>
<th>Nome</th>
<th>Lordo</th>
<th>Tasse</th>
<th>Netto</th>
</tr>
`

$('#tbody').innerHTML = rows
.filter(r =>
String(r.type || r.Type || '')
.toUpperCase() === 'DIVIDEND'
)
.map(r => {

const g =
Math.abs(num(r.amount || r.Amount))

const t =
Math.abs(num(r.tax || r.Tax))

const n =
Math.max(0, g - t)

return `
<tr>
<td>${r.date || r.Date || ''}</td>
<td>${r.name || r.Name || ''}</td>
<td>${money(g)}</td>
<td>${money(t)}</td>
<td>${money(n)}</td>
</tr>
`

}).join('')

/* ===== MENSILE ===== */

$('#mhead').innerHTML = `
<tr>
<th>Mese</th>
<th>Netto</th>
</tr>
`

$('#mbody').innerHTML =
Object.entries(s.monthly)
.map(([k,v]) => `
<tr>
<td>${k}</td>
<td>${money(v)}</td>
</tr>
`).join('')

/* ===== ASSET ===== */

$('#ahead').innerHTML = `
<tr>
<th>Strumento</th>
<th>Netto</th>
</tr>
`

$('#abody').innerHTML =
Object.entries(s.assets)
.sort((a,b)=>b[1]-a[1])
.map(([k,v]) => `
<tr>
<td>${k}</td>
<td>${money(v)}</td>
</tr>
`).join('')

/* ===== PROMPT ===== */

const compact = {
dividendiNetti: s.net,
mediaMensile: s.avg,
coperturaMutuo: s.mortgage,
topPagatori:
Object.entries(s.assets)
.sort((a,b)=>b[1]-a[1])
.slice(0,10)
}

state.prompt = `
Analizza questo portafoglio Trade Republic.

I dividendi qui sotto sono già NETTI.

${JSON.stringify(compact,null,2)}

Obiettivi:
- aumentare cashflow;
- capire copertura mutuo 650€/mese;
- valutare rischio;
- migliorare dividendi.
`

$('#promptOut').textContent = state.prompt

}

/* =========================
   EVENTI
========================= */

$('#parseBtn').onclick = () => {

try{

const txt = $('#rawInput').value

if(!txt.trim()){
alert('Incolla o carica un CSV.')
return
}

const rows = parseCSV(txt)

if(!rows.length){
alert('CSV non valido o vuoto.')
return
}

state.rows = rows

analyze(rows)

}
catch(err){

console.error(err)

alert(
'Errore lettura CSV:\n' +
(err.message || err)
)

}

}

$('#fileInput').addEventListener('change', async e => {

try{

const file = e.target.files[0]

if(!file) return

const text = await file.text()

$('#rawInput').value = text

const rows = parseCSV(text)

state.rows = rows

analyze(rows)

}
catch(err){

console.error(err)

alert(
'Errore apertura file:\n' +
(err.message || err)
)

}

})

$('#copyPrompt').onclick = async () => {

try{

await navigator.clipboard.writeText(state.prompt)

alert('Report AI copiato')

}
catch(e){

alert('Copia manualmente il report.')

}

}

$('#demoBtn').onclick = () => {

const demo = `datetime,date,type,asset_class,name,symbol,amount,tax
2026-01-01,2026-01-01,DIVIDEND,STOCK,BlackRock TCP Capital,US09259E1082,4.92,-1.83
2026-05-08,2026-05-08,DIVIDEND,ETF,JPMorgan Global Equity Premium Income,IE0003UVYC20,7.77,-2.08`

$('#rawInput').value = demo

const rows = parseCSV(demo)

state.rows = rows

analyze(rows)

}

$('#resetBtn').onclick = () => {
location.reload()
}

/* =========================
   TABS
========================= */

$$('.tab').forEach(t => {

t.onclick = () => {

$$('.tab').forEach(x =>
x.classList.remove('active')
)

t.classList.add('active')

$$('.tabpane').forEach(p =>
p.classList.add('hidden')
)

$('#tab-'+t.dataset.tab)
.classList.remove('hidden')

}

})

</script>
